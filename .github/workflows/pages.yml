name: Publicar la web

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml", "engine/src/site.py", "engine/src/redes.mjs", "engine/src/export_events.py"]
  schedule:
    - cron: "37 4 * * *"   # cada mañana, con los planes del día en las páginas para buscadores
  workflow_run:  # en cuanto se cargan planes nuevos, se regeneran los archivos que descarga la app
    workflows: ["Actualización nocturna", "Ciudades (motor genérico)", "Clasificar con IA", "Cortes de calle"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # tras una carga fallida no se publica (podría haber dejado datos a medias); la publicación diaria lo recoge después
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Versión visible en la app (para saber si un móvil tiene la última)
        run: sed -i "s/Versión __VER__/Versión $(TZ=Europe/Madrid date +'%d-%m %H:%M') · ${GITHUB_SHA::7}/" web/index.html
      # Copia de la última lectura de Supabase: si solo cambia el código (push), se reutiliza en vez de descargar otra vez toda
      # la base de datos (el cupo de transferencia del plan gratuito es de 5 GB al mes). Tras una carga nueva o cada mañana, se lee fresca.
      - name: Recuperar la última lectura de la base de datos
        id: sbcache
        uses: actions/cache/restore@v4
        with:
          path: sbcache
          key: sbdatos-${{ github.run_id }}
          restore-keys: sbdatos-
      - name: ¿Reutilizar la lectura?
        run: |
          echo "SB_CACHE_DIR=$GITHUB_WORKSPACE/sbcache" >> $GITHUB_ENV
          if [ "${{ github.event_name }}" = "push" ] && [ -n "${{ steps.sbcache.outputs.cache-matched-key }}" ]; then
            echo "SB_CACHE_USE=1" >> $GITHUB_ENV; echo "Cambio de código: se reutiliza la última lectura"
          elif [ "${{ github.event.workflow_run.name }}" = "Cortes de calle" ] && [ -n "${{ steps.sbcache.outputs.cache-matched-key }}" ]; then
            echo "SB_CACHE_USE=1" >> $GITHUB_ENV; echo "SB_CACHE_FRESH=closures" >> $GITHUB_ENV; echo "Cortes nuevos: solo se leen los cortes"
          else
            rm -rf sbcache; echo "SB_CACHE_USE=0" >> $GITHUB_ENV; echo "Lectura nueva de la base de datos"
          fi
      - name: Planes de cada zona en archivos estáticos (los descarga la app; menos carga para Supabase)
        working-directory: engine
        run: python3 src/export_events.py ../web
      - name: Páginas para buscadores (zonas, categorías y eventos) y sitemap
        working-directory: engine
        run: python3 src/site.py ../web
      - name: Guardar la lectura para las próximas publicaciones
        if: env.SB_CACHE_USE == '0' || env.SB_CACHE_FRESH != ''
        uses: actions/cache/save@v4
        with:
          path: sbcache
          key: sbdatos-${{ github.run_id }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Imágenes del carrusel semanal para Instagram (/redes/)
        continue-on-error: true   # si falla, la web se publica igual
        working-directory: engine/src
        run: |
          npm i --no-save --no-package-lock playwright@1.49.1
          npx playwright install --with-deps chromium
          sudo apt-get install -y -qq ffmpeg >/dev/null
          node redes.mjs ../../web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4

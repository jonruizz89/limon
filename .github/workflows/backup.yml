name: Copia de seguridad

# Cada domingo: copia completa de la base de datos (datos de la app y cuentas), comprimida y CIFRADA con una frase
# que solo tiene Jon. Se guarda 90 días en un repositorio PRIVADO aparte, como «release» (este repositorio es público y sus
# artefactos los puede descargar cualquiera con cuenta de GitHub: aquí ya no se sube ninguna copia).
# Secretos: SUPABASE_DB_PASSWORD (contraseña de la base de datos) y BACKUP_PASSPHRASE. También vale SUPABASE_DB_URL en lugar de la contraseña.
#           BACKUP_REPO (el repositorio privado, «dueño/nombre») y BACKUP_REPO_TOKEN (token de GitHub con permiso de
#           escritura de contenidos SOLO en ese repositorio). Sin ellos el flujo falla y avisa: no hay copia en sitio público.
# Restaurar: ver «Copias de seguridad» en el README.
on:
  schedule:
    - cron: "23 3 * * 0"
  workflow_dispatch:

# el token del flujo solo puede leer el repositorio
permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      REF: pxeqbxxfsrvsxcdfiddc
      REGION: eu-central-1
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      BACKUP_REPO: ${{ secrets.BACKUP_REPO }}
      GH_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
    steps:
      - name: Comprobar los secretos
        run: |
          if { [ -z "$SUPABASE_DB_URL" ] && [ -z "$PGPASSWORD" ]; } || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Faltan los secretos SUPABASE_DB_PASSWORD y/o BACKUP_PASSPHRASE en GitHub"; exit 1; fi
          if [ -z "$BACKUP_REPO" ] || [ -z "$GH_TOKEN" ]; then
            echo "::error::Faltan los secretos BACKUP_REPO y/o BACKUP_REPO_TOKEN: la copia se guarda en un repositorio privado (ver README, «Copias de seguridad»)"; exit 1; fi
          # el destino tiene que ser privado: si no, no se sube nada
          vis=$(gh api "repos/$BACKUP_REPO" --jq .visibility 2>/dev/null || true)
          if [ "$vis" != "private" ]; then echo "::error::El repositorio de copias no existe, no es privado o el token no llega a él"; exit 1; fi
      - name: Instalar pg_dump 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -sSf -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17 >/dev/null
          /usr/lib/postgresql/17/bin/pg_dump --version
      - name: Volcar, comprimir y cifrar
        run: |
          set -euo pipefail
          D=$(date -u +%Y-%m-%d); mkdir -p out; umask 077
          PGD=/usr/lib/postgresql/17/bin/pg_dump
          # lo normal: solo la contraseña; se busca el «session pooler» de la región (GitHub no tiene IPv6 para la conexión directa).
          # Si SUPABASE_DB_URL es una cadena postgresql:// completa se usa tal cual; si no, se trata como la contraseña.
          if [[ "${SUPABASE_DB_URL:-}" =~ ^postgres(ql)?://[^/]*@ ]]; then
            DB=("$SUPABASE_DB_URL"); echo "conexión: cadena completa"
          else
            export PGPASSWORD="${PGPASSWORD:-$SUPABASE_DB_URL}" PGUSER="postgres.$REF" PGPORT=5432 PGDATABASE=postgres PGSSLMODE=require
            for h in aws-0-$REGION.pooler.supabase.com aws-1-$REGION.pooler.supabase.com; do
              if out=$(PGHOST=$h PGCONNECT_TIMEOUT=10 /usr/lib/postgresql/17/bin/psql -tAc 'select 1' 2>&1); then export PGHOST=$h; break; fi
              echo "$h: $(echo "$out" | head -1 | sed 's/password[^ ]*/***/g')"
            done
            [ -n "${PGHOST:-}" ] || { echo "::error::No se ha podido conectar a la base de datos: revisa la contraseña (SUPABASE_DB_PASSWORD)"; exit 1; }
            echo "conectado por $PGHOST"; DB=()
          fi
          # 1) la app: esquema y datos del esquema public, con sus permisos (lo nuevo nace cerrado: sin ellos la web no podría leer nada)
          $PGD "${DB[@]}" -n public --no-owner -Fc -f app.dump
          # 2) las cuentas: solo datos de usuarios e identidades (el esquema auth lo crea Supabase)
          $PGD "${DB[@]}" --data-only -t auth.users -t auth.identities --no-owner --no-privileges -Fc -f cuentas.dump
          tar czf limon.tgz app.dump cuentas.dump
          echo "$BACKUP_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --symmetric --cipher-algo AES256 -o "out/limon-$D.tgz.gpg" limon.tgz
          rm -f app.dump cuentas.dump limon.tgz
          ls -la out
      - name: Guardar en el repositorio privado y quitar las copias de más de 90 días
        run: |
          set -euo pipefail
          D=$(date -u +%Y-%m-%d)
          gh release create "copia-$D-${{ github.run_id }}" out/*.gpg --repo "$BACKUP_REPO" --title "Copia $D" --notes "Copia cifrada de la base de datos de Limón."
          limite=$(date -u -d '90 days ago' +%Y-%m-%dT%H:%M:%SZ)
          gh release list --repo "$BACKUP_REPO" --limit 200 --json tagName,createdAt \
            --jq ".[] | select(.tagName | startswith(\"copia-\")) | select(.createdAt < \"$limite\") | .tagName" |
            while read -r t; do gh release delete "$t" --repo "$BACKUP_REPO" --yes --cleanup-tag; done
          echo "Copia guardada."

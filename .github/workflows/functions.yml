name: Funciones del servidor

# Publica en Supabase las funciones que cambian en supabase/functions/ (o todas, a mano).
#  - rama main:    las funciones de verdad (limon-mail, limon-ai…).
#  - rama pruebas: las mismas funciones en el proyecto de pruebas («Limon pruebas»), que usa pruebas.limonplanes.com.
# Necesita el secreto SUPABASE_ACCESS_TOKEN (Supabase → Account → Access Tokens) y, para pruebas, SUPABASE_PRUEBAS_ACCESS_TOKEN.
on:
  push:
    branches: [main, pruebas]
    paths: ["supabase/functions/**"]
  workflow_dispatch:
    inputs:
      only:
        description: "Funciones a publicar, separadas por espacios (vacío = todas)"
        required: false
        default: ""

# el token del flujo solo puede leer el repositorio
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # el token de producción solo vale para su proyecto: pruebas tiene el suyo
      SUPABASE_ACCESS_TOKEN: ${{ github.ref_name == 'pruebas' && secrets.SUPABASE_PRUEBAS_ACCESS_TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT: ${{ github.ref_name == 'pruebas' && 'vxxempphqdpzrzcrtfvw' || 'pxeqbxxfsrvsxcdfiddc' }}
      SUFFIX: ''
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ONLY: ${{ inputs.only }}
      EVENT: ${{ github.event_name }}
      BEFORE: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb  # v1.7.3
        with:
          version: latest
      - name: Publicar
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "Falta el secreto SUPABASE_ACCESS_TOKEN: no se publica nada."; exit 0; fi
          if [ -n "$ONLY" ]; then fns="$ONLY";
          elif [ "$EVENT" = "push" ]; then
            # todos los commits del push (al publicar en main llegan varios a la vez), no solo el último
            base="$BEFORE"; git cat-file -e "$base^{commit}" 2>/dev/null || base=HEAD~1
            fns=$(git diff --name-only "$base" HEAD -- supabase/functions | cut -d/ -f3 | sort -u)
            # si cambia el código compartido, se publican todas las que lo usan
            if echo "$fns" | grep -qx "_shared"; then fns="$fns $(grep -l '_shared/' supabase/functions/*/index.ts | cut -d/ -f3)"; fi
          else fns=$(ls supabase/functions); fi
          for f in $(echo $fns | tr ' ' '\n' | sort -u); do
            [ -f "supabase/functions/$f/index.ts" ] || continue
            name="$f$SUFFIX"
            if [ -n "$SUFFIX" ]; then cp -r "supabase/functions/$f" "supabase/functions/$name"; fi
            echo "== $name"
            supabase functions deploy "$name" --project-ref "$PROJECT" --no-verify-jwt --use-api --yes
          done
      - name: Ajustes de las funciones de pruebas
        if: github.ref_name == 'pruebas'
        # si el token de pruebas no tiene permiso para los ajustes, se guardan a mano en Supabase (Edge Functions → Secrets)
        continue-on-error: true
        run: |
          # enlaces de los correos a la web de pruebas y la IA con un tope de gasto bajo; la clave de Anthropic, sin imprimirla
          args="LIMON_APP_URL=https://pruebas.limonplanes.com/ LIMON_AI_MAX_USD_DAY=0.5"
          [ -n "$ANTHROPIC_API_KEY" ] && args="$args ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY"
          supabase secrets set $args --project-ref "$PROJECT" --yes 2>&1 | grep -iE "finished|error|nothing" | tail -2; test "${PIPESTATUS[0]}" = 0

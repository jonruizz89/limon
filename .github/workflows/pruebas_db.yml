name: Base de datos de pruebas

# Copia la ESTRUCTURA de la base de datos de producción («Limon») en el proyecto de pruebas («Limon pruebas») y le carga
# datos de catálogo (ciudades, categorías, fuentes) y los planes vigentes de unas zonas. Nunca copia datos de personas
# (cuentas, perfiles, guardados, listas, avisos, estadísticas de uso…) ni claves (app_keys).
# Se lanza a mano. modo=estructura → solo esquema; modo=datos → solo datos; modo=todo → las dos cosas (en un proyecto vacío).
# Secretos: SUPABASE_DB_URL o SUPABASE_DB_PASSWORD (leer producción) y SUPABASE_PRUEBAS_DB_PASSWORD (la contraseña de la base
# de datos del proyecto de pruebas, para escribir en ella). Ninguno se imprime.
on:
  # los lunes se añaden los planes nuevos de las zonas de pruebas (los que ya estaban se dejan como están)
  schedule:
    - cron: "13 5 * * 1"
  workflow_dispatch:
    inputs:
      modo:
        description: "todo | estructura | datos"
        default: todo
      zonas:
        description: "Zonas con planes, separadas por comas"
        default: madrid,gijon

permissions:
  contents: read

jobs:
  copiar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PRUEBAS_PASSWORD: ${{ secrets.SUPABASE_PRUEBAS_DB_PASSWORD }}
      REF: pxeqbxxfsrvsxcdfiddc       # producción (solo lectura)
      DEST: vxxempphqdpzrzcrtfvw      # pruebas
      REGION: eu-central-1
      MODO: ${{ github.event.inputs.modo || 'datos' }}
      ZONAS: ${{ github.event.inputs.zonas || 'madrid,gijon' }}
    steps:
      - name: Instalar psql 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -sSf -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17 >/dev/null
      - name: Leer de producción
        run: |
          set -euo pipefail
          B=/usr/lib/postgresql/17/bin
          if [[ "${SUPABASE_DB_URL:-}" =~ ^postgres(ql)?://[^/]*@ ]]; then DB=("$SUPABASE_DB_URL")
          else
            export PGPASSWORD="${PGPASSWORD:-$SUPABASE_DB_URL}" PGUSER="postgres.$REF" PGPORT=5432 PGDATABASE=postgres PGSSLMODE=require
            for h in aws-0-$REGION.pooler.supabase.com aws-1-$REGION.pooler.supabase.com; do
              if PGHOST=$h PGCONNECT_TIMEOUT=10 $B/psql -tAc 'select 1' >/dev/null 2>&1; then export PGHOST=$h; break; fi
            done
            [ -n "${PGHOST:-}" ] || { echo "::error::No se ha podido conectar a producción"; exit 1; }
            DB=()
          fi
          mkdir -p out
          # las zonas van dentro de una consulta: solo letras, números, guiones y comas
          [[ "$ZONAS" =~ ^[a-z0-9_,\ -]+$ ]] || { echo "::error::Zonas no válidas"; exit 1; }
          # huella de los permisos de producción (qué puede hacer la web en cada tabla y función), para comparar al final
          $B/psql "${DB[@]}" -tA -v ON_ERROR_STOP=1 -f - > out/huella_prod.txt <<'SQL'
          select md5(string_agg(x, '|' order by x)) from (
            select 't:'||table_name||':'||grantee||':'||privilege_type x from information_schema.role_table_grants where table_schema='public' and grantee in ('anon','authenticated','PUBLIC')
            union all select 'f:'||p.oid::regprocedure::text||':'||v.r from pg_proc p cross join (values ('anon'),('authenticated')) v(r) where p.pronamespace='public'::regnamespace and has_function_privilege(v.r, p.oid, 'execute')) z;
          SQL
          if [ "$MODO" != "datos" ]; then
            # esquema public con permisos y reglas de acceso; sin dueños. Fuera las órdenes propias de psql (\restrict) y el CREATE SCHEMA.
            $B/pg_dump "${DB[@]}" -n public --schema-only --no-owner -f out/esquema.sql
            sed -i -E '/^\\(un)?restrict /d; /^CREATE SCHEMA public;/d; /^COMMENT ON SCHEMA public /d; /^ALTER DEFAULT PRIVILEGES FOR ROLE supabase_admin/d' out/esquema.sql
            # los permisos, aparte: se vuelven a aplicar después de cerrar los que el proyecto de pruebas da por defecto
            grep -E '^(GRANT|REVOKE) ' out/esquema.sql > out/permisos.sql
            echo "esquema: $(wc -c < out/esquema.sql) bytes, $(grep -c '^CREATE TABLE' out/esquema.sql) tablas, $(grep -c '^CREATE FUNCTION' out/esquema.sql) funciones"
          fi
          if [ "$MODO" != "estructura" ]; then
            Z="'$(echo "$ZONAS" | sed "s/ //g; s/,/','/g")'"
            # cada tabla en trozos de 400 filas: «insert … select * from json_populate_recordset», respetando los identificadores
            q() {  # $1 tabla  $2 consulta que devuelve sus filas
              $B/psql "${DB[@]}" -tA -v ON_ERROR_STOP=1 -c "
                select format('insert into public.%I overriding system value select * from json_populate_recordset(null::public.%I, %L) on conflict do nothing;', '$1', '$1', json_agg(to_json(t.x)))
                from (select x, (row_number() over () - 1) / 400 as g from ($2) x) t group by g order by g" > "out/datos_$1.sql"
              echo "$1: $(grep -c . "out/datos_$1.sql") trozos"
            }
            q category_groups "select * from public.category_groups"
            q categories "select * from public.categories"
            q sensitive_categories "select * from public.sensitive_categories"
            q cities "select * from public.cities order by parent nulls first"
            q aemet_zonas "select * from public.aemet_zonas"
            q sources "select * from public.sources where city_id in ($Z)"
            q venues "select * from public.venues where city_id in ($Z)"
            q events "select * from public.events where city_id in ($Z) and coalesce(ends_on, starts_on) >= current_date"
            q event_sessions "select s.* from public.event_sessions s join public.events e on e.id = s.event_id where e.city_id in ($Z) and coalesce(e.ends_on, e.starts_on) >= current_date"
            q event_categories "select c.* from public.event_categories c join public.events e on e.id = c.event_id where e.city_id in ($Z) and coalesce(e.ends_on, e.starts_on) >= current_date"
            q event_sources "select s.* from public.event_sources s join public.events e on e.id = s.event_id join public.sources so on so.id = s.source_id where e.city_id in ($Z) and so.city_id in ($Z) and coalesce(e.ends_on, e.starts_on) >= current_date"
            q closures "select * from public.closures where city_id in ($Z)"
          fi
      - name: Escribir en pruebas
        run: |
          set -euo pipefail
          [ -n "$PRUEBAS_PASSWORD" ] || { echo "::error::Falta el secreto SUPABASE_PRUEBAS_DB_PASSWORD"; exit 1; }
          B=/usr/lib/postgresql/17/bin
          export PGPASSWORD="$PRUEBAS_PASSWORD" PGUSER="postgres.$DEST" PGPORT=5432 PGDATABASE=postgres PGSSLMODE=require
          unset PGHOST
          for h in aws-0-$REGION.pooler.supabase.com aws-1-$REGION.pooler.supabase.com; do
            if PGHOST=$h PGCONNECT_TIMEOUT=10 $B/psql -tAc 'select 1' >/dev/null 2>&1; then export PGHOST=$h; break; fi
          done
          [ -n "${PGHOST:-}" ] || { echo "::error::No se ha podido conectar a la base de datos de pruebas (revisa SUPABASE_PRUEBAS_DB_PASSWORD)"; exit 1; }
          run() { $B/psql -q -v ON_ERROR_STOP=1 -f "$1" >/dev/null; }
          if [ -f out/esquema.sql ]; then
            run out/esquema.sql; echo "esquema cargado"
            # Un proyecto nuevo de Supabase da por defecto todos los permisos a la web (anon y authenticated) en cada tabla y
            # función que se crea. Aquí se cierran y se dejan exactamente los de producción: lo nuevo nace cerrado.
            $B/psql -q -v ON_ERROR_STOP=1 >/dev/null <<'SQL'
            alter default privileges for role postgres in schema public revoke all on tables from anon, authenticated;
            alter default privileges for role postgres in schema public revoke execute on functions from anon, authenticated;
            alter default privileges for role postgres revoke execute on functions from public;
            revoke all on all tables in schema public from anon, authenticated;
            revoke execute on all functions in schema public from public, anon, authenticated;
          SQL
            run out/permisos.sql; echo "permisos como en producción"
          fi
          for t in category_groups categories sensitive_categories cities aemet_zonas sources venues events event_sessions event_categories event_sources closures; do
            f=out/datos_$t.sql; [ -f "$f" ] || continue
            run "$f"; echo "$t: $($B/psql -tAc "select count(*) from public.$t") filas"
          done
          if ls out/datos_*.sql >/dev/null 2>&1; then
            $B/psql -q -v ON_ERROR_STOP=1 -c "select setval(pg_get_serial_sequence('public.events','id'), coalesce((select max(id) from public.events), 1));
              select setval(pg_get_serial_sequence('public.venues','id'), coalesce((select max(id) from public.venues), 1));
              select setval(pg_get_serial_sequence('public.sources','id'), coalesce((select max(id) from public.sources), 1));" >/dev/null
            echo "contadores al día"
          fi
      - name: Comprobar los permisos de pruebas
        run: |
          set -euo pipefail
          B=/usr/lib/postgresql/17/bin
          export PGPASSWORD="$PRUEBAS_PASSWORD" PGUSER="postgres.$DEST" PGPORT=5432 PGDATABASE=postgres PGSSLMODE=require
          unset PGHOST
          for h in aws-0-$REGION.pooler.supabase.com aws-1-$REGION.pooler.supabase.com; do
            if PGHOST=$h PGCONNECT_TIMEOUT=10 $B/psql -tAc 'select 1' >/dev/null 2>&1; then export PGHOST=$h; break; fi
          done
          # 1) lo que nunca puede pasar: que la web sin cuenta escriba en algo que no sean las estadísticas de uso, que haya
          #    permisos en tablas sin reglas de acceso, o que se puedan llamar desde fuera las funciones internas
          mal=$($B/psql -tA -v ON_ERROR_STOP=1 -f - <<'SQL'
          select (select count(*) from information_schema.role_table_grants where table_schema='public' and grantee in ('anon','PUBLIC') and privilege_type <> 'SELECT' and not (table_name = 'activity' and privilege_type = 'INSERT'))
               + (select count(*) from information_schema.role_table_grants g where table_schema='public' and grantee in ('anon','authenticated','PUBLIC') and not exists (select 1 from pg_policies p where p.schemaname='public' and p.tablename=g.table_name))
               + (select count(*) from pg_proc p where p.pronamespace='public'::regnamespace and p.proname in ('ai_usage_add','ai_usage_reserve','ai_usage_settle','retire_stale_events','retire_stale_events_window','limon_limpieza','refresh_affinity','rate_ok','x_lanzar','ig_lanzar') and (has_function_privilege('anon', p.oid, 'execute') or has_function_privilege('authenticated', p.oid, 'execute')));
          SQL
          )
          [ "$mal" = "0" ] || { echo "::error::La base de datos de pruebas tiene $mal permisos abiertos de más. Lanza este flujo con modo=estructura."; exit 1; }
          # 2) y que coincidan con los de producción (si no coinciden, falta pasar a pruebas algún cambio de estructura)
          hp=$(cat out/huella_prod.txt); ht=$($B/psql -tA -v ON_ERROR_STOP=1 -f - <<'SQL'
          select md5(string_agg(x, '|' order by x)) from (
            select 't:'||table_name||':'||grantee||':'||privilege_type x from information_schema.role_table_grants where table_schema='public' and grantee in ('anon','authenticated','PUBLIC')
            union all select 'f:'||p.oid::regprocedure::text||':'||v.r from pg_proc p cross join (values ('anon'),('authenticated')) v(r) where p.pronamespace='public'::regnamespace and has_function_privilege(v.r, p.oid, 'execute')) z;
          SQL
          )
          if [ "$hp" = "$ht" ]; then echo "permisos: iguales que en producción"
          elif [ "$MODO" = "datos" ]; then echo "::warning::Los permisos de pruebas no coinciden con los de producción: falta pasar algún cambio de estructura (modo=estructura)."
          else echo "::error::Tras copiar la estructura, los permisos de pruebas no coinciden con los de producción."; exit 1; fi

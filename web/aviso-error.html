<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>No se ha podido apuntar · Limón</title>
<link rel="icon" href="/limon.svg" type="image/svg+xml">
<style>
  :root { --bg: #EEF0F3; --surface: #FFFFFF; --ink: #12182B; --quiet: #4B5366; --accent: #FFD43B; --accent-ink: #231D02; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0F1320; --surface: #181E2E; --ink: #E8EBF2; --quiet: #A3ABBD; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 24px 16px; }
  main { background: var(--surface); border-radius: 18px; padding: 28px 24px; max-width: 440px; width: 100%; text-align: center; }
  img { width: 64px; height: 64px; }
  h1 { font-size: 22px; margin: 12px 0 6px; }
  p { color: var(--quiet); margin: 0 0 18px; }
  a.btn { display: inline-block; background: var(--accent); color: var(--accent-ink); font-weight: 700; text-decoration: none;
    padding: 12px 20px; border-radius: 999px; margin: 4px; }
  a.sec { display: inline-block; color: var(--ink); margin: 8px 6px 0; }
</style>
</head>
<body>
<main>
  <img src="/limon.svg" alt="" width="64" height="64">
  <h1>No hemos podido apuntarte</h1>
  <p>Revisa que el correo esté bien escrito y vuelve a intentarlo. Si sigue fallando, prueba más tarde.</p>
  <a class="btn" href="/">Ver planes en Limón</a>
</main>
</body>
</html>

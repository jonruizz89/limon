name: Clasificar con IA

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Máximo de eventos a clasificar (vacío = todos los pendientes)"
        required: false

# el token del flujo solo puede leer el repositorio
permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Clasificar
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET: ${{ secrets.SUPABASE_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BUREO_AI_LIMIT: ${{ inputs.limit || '100000' }}
        run: python3 src/classify.py
